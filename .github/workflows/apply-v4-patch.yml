name: Apply V4 Patch

on:
  push:
    branches: [v4-active]
    paths:
      - scripts/v4.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4-active
      - run: python scripts/patch_v4.py
      - name: Commit V4 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css package.json
          if git diff --cached --quiet; then
            echo "No patch changes"
          else
            git commit -m "Implement Fernández Conde OS V4"
            git push origin HEAD:v4-active
          fi
