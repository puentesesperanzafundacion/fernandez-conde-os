name: Apply V2 Patch

on:
  push:
    branches: [v2-development]
    paths:
      - scripts/patch_v2.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-development
      - run: python scripts/patch_v2.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx package.json
          if git diff --cached --quiet; then
            echo "No patch changes"
          else
            git commit -m "Fix V2 form and typing issues"
            git push origin HEAD:v2-development
          fi
