name: Apply V3 Patch

on:
  push:
    branches: [v3-development]
    paths:
      - scripts/**

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-development
      - run: python scripts/patch_v3.py
      - name: Commit V3 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css package.json
          if git diff --cached --quiet; then
            echo "No patch changes"
          else
            git commit -m "Implement Fernández Conde OS V3"
            git push origin HEAD:v3-development
          fi
